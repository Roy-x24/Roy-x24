<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="176" viewBox="0 0 1000 176" role="img" aria-label="Principios"><title>Principios</title><defs></defs><g transform="translate(0 0)"><rect x=".5" y=".5" width="228" height="175" rx="14" fill="#111827" stroke="#1f2937"/><rect x="20" y="20" width="46" height="46" rx="12" fill="#10b981" fill-opacity=".14" stroke="#10b981" stroke-opacity=".5"/><text x="43" y="49" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="800" fill="#10b981">&lt;/&gt;<animate attributeName="opacity" values="1;.55;1" dur="3.0s" repeatCount="indefinite"/></text><text x="20" y="98" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#e2e8f0">Clean Code</text><text x="20" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Código legible, modular y</text><text x="20" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">con revisiones de pares.</text></g><g transform="translate(257 0)"><rect x=".5" y=".5" width="228" height="175" rx="14" fill="#111827" stroke="#1f2937"/><rect x="20" y="20" width="46" height="46" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/><text x="43" y="49" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="800" fill="#a78bfa">#!<animate attributeName="opacity" values="1;.55;1" dur="3.5s" repeatCount="indefinite"/></text><text x="20" y="98" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#e2e8f0">Seguridad primero</text><text x="20" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Validación, roles y</text><text x="20" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">trazabilidad desde el</text><text x="20" y="156" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">diseño.</text></g><g transform="translate(514 0)"><rect x=".5" y=".5" width="228" height="175" rx="14" fill="#111827" stroke="#1f2937"/><rect x="20" y="20" width="46" height="46" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><text x="43" y="49" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="800" fill="#22d3ee">→<animate attributeName="opacity" values="1;.55;1" dur="4.0s" repeatCount="indefinite"/></text><text x="20" y="98" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#e2e8f0">Entregas pequeñas</text><text x="20" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">Scrum, iteraciones cortas</text><text x="20" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">y feedback constante.</text></g><g transform="translate(771 0)"><rect x=".5" y=".5" width="228" height="175" rx="14" fill="#111827" stroke="#1f2937"/><rect x="20" y="20" width="46" height="46" rx="12" fill="#f59e0b" fill-opacity=".14" stroke="#f59e0b" stroke-opacity=".5"/><text x="43" y="49" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="800" fill="#f59e0b">§<animate attributeName="opacity" values="1;.55;1" dur="4.5s" repeatCount="indefinite"/></text><text x="20" y="98" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#e2e8f0">Todo documentado</text><text x="20" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">READMEs, APIs y decisiones</text><text x="20" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#94a3b8">que cualquiera entiende.</text></g></svg>
