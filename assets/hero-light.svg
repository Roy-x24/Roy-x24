<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Roy Barrera — Full Stack Developer"><title>Roy Barrera — Full Stack Developer</title><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset=".5" stop-color="#ecfdf5"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#0e7490"/><stop offset=".55" stop-color="#059669"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#0f172a" stroke-opacity="0.05"/></pattern>
<radialGradient id="fade" cx=".5" cy=".5" r=".7"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="m"><rect width="1200" height="360" fill="url(#fade)"/></mask></defs>
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)" mask="url(#m)"/>
<g filter="url(#blur)">
  <circle cx="220" cy="120" r="120" fill="#0891b2" opacity=".30"><animate attributeName="cx" values="220;420;220" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="120;200;120" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="200" r="140" fill="#7c3aed" opacity=".28"><animate attributeName="cx" values="980;780;980" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="200;110;200" dur="12s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="300" r="130" fill="#059669" opacity=".30"><animate attributeName="cx" values="600;700;500;600" dur="18s" repeatCount="indefinite"/></circle>
</g>
