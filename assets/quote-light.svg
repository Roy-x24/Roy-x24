<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Cita"><title>Cita</title><defs><linearGradient id="qg" x1="0" x2="1"><stop offset="0" stop-color="#0e7490"/><stop offset=".5" stop-color="#059669"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><text x="40" y="100" font-family="Georgia, serif" font-size="120" fill="url(#qg)" opacity=".4">“</text><text x="500" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#0f172a">El software no solo se programa — se diseña, se estructura y</text><text x="500" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic" fill="#0f172a">se construye para resolver problemas reales.</text><text x="500" y="154" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" fill="#059669" letter-spacing="2">— ROY BARRERA</text></svg>
