<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="176" viewBox="0 0 1000 176" role="img" aria-label="Principios"><title>Principios</title><defs></defs><g transform="translate(0 0)"><rect x=".5" y=".5" width="228" height="175" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="20" y="20" width="46" height="46" rx="12" fill="#059669" fill-opacity=".14" stroke="#059669" stroke-opacity=".5"/><text x="43" y="49" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="800" fill="#059669">&lt;/&gt;<animate attributeName="opacity" values="1;.55;1" dur="3.0s" repeatCount="indefinite"/></text><text x="20" y="98" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Clean Code</text><text x="20" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569">Código legible, modular y</text><text x="20" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569">con revisiones de pares.</text></g><g transform="translate(257 0)"><rect x=".5" y=".5" width="228" height="175" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="20" y="20" width="46" height="46" rx="12" fill="#7c3aed" fill-opacity=".14" stroke="#7c3aed" stroke-opacity=".5"/><text x="43" y="49" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="800" fill="#7c3aed">#!<animate attributeName="opacity" values="1;.55;1" dur="3.5s" repeatCount="indefinite"/></text><text x="20" y="98" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Seguridad primero</text><text x="20" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569">Validación, roles y</text><text x="20" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569">trazabilidad desde el</text><text x="20" y="156" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569">diseño.</text></g><g transform="translate(514 0)"><rect x=".5" y=".5" width="228" height="175" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="20" y="20" width="46" height="46" rx="12" fill="#0891b2" fill-opacity=".14" stroke="#0891b2" stroke-opacity=".5"/><text x="43" y="49" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="800" fill="#0891b2">→<animate attributeName="opacity" values="1;.55;1" dur="4.0s" repeatCount="indefinite"/></text><text x="20" y="98" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Entregas pequeñas</text><text x="20" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569">Scrum, iteraciones cortas</text><text x="20" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569">y feedback constante.</text></g><g transform="translate(771 0)"><rect x=".5" y=".5" width="228" height="175" rx="14" fill="#f8fafc" stroke="#e2e8f0"/><rect x="20" y="20" width="46" height="46" rx="12" fill="#d97706" fill-opacity=".14" stroke="#d97706" stroke-opacity=".5"/><text x="43" y="49" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="800" fill="#d97706">§<animate attributeName="opacity" values="1;.55;1" dur="4.5s" repeatCount="indefinite"/></text><text x="20" y="98" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Todo documentado</text><text x="20" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569">READMEs, APIs y decisiones</text><text x="20" y="138" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#475569">que cualquiera entiende.</text></g></svg>
