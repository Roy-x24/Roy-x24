name: Generate profile assets

# Genera las tarjetas de estadísticas y la animación snake y las publica
# en la rama `output`. El README las consume desde:
#   https://raw.githubusercontent.com/Roy-x24/Roy-x24/output/<archivo>.svg

on:
  schedule:
    - cron: "0 */12 * * *" # cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # ─────────────── Snake ───────────────
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#059669&color_dots=#ebedf0,#a7f3d0,#34d399,#10b981,#047857
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#064e3b,#047857,#10b981,#34d399

      # ─────────────── GitHub Stats ───────────────
      - name: Stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&custom_title=GitHub%20Stats&bg_color=0d1117&title_color=10b981&icon_color=22d3ee&text_color=c9d1d9&ring_color=10b981&border_color=1e293b&border_radius=12
          path: dist/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&custom_title=GitHub%20Stats&bg_color=ffffff&title_color=059669&icon_color=0891b2&text_color=334155&ring_color=059669&border_color=e2e8f0&border_radius=12
          path: dist/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=hack,mako,makefile,powershell,dockerfile,shell&custom_title=Most%20Used%20Languages&bg_color=0d1117&title_color=10b981&text_color=c9d1d9&border_color=1e293b&border_radius=12
          path: dist/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide=hack,mako,makefile,powershell,dockerfile,shell&custom_title=Most%20Used%20Languages&bg_color=ffffff&title_color=059669&text_color=334155&border_color=e2e8f0&border_radius=12
          path: dist/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────── Publish ───────────────
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "chore: update profile assets [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
